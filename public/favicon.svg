<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- crisp gradient border from cyan to emerald -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- solid obsidian rounded square background -->
  <rect x="0" y="0" width="32" height="32" rx="3" fill="#060913"/>
  <!-- crisp border using gradient -->
  <rect x="0" y="0" width="32" height="32" rx="3" stroke="url(#borderGrad)" stroke-width="1.5" fill="none"/>
  <!-- bold angular left strand (cyan) -->
  <path d="M 6 4 L 8 12 L 10 20 L 12 26 L 14 30" stroke="#22d3ee" stroke-width="3" fill="none"/>
  <!-- bold angular right strand (emerald) -->
  <path d="M 26 4 L 24 12 L 22 20 L 20 26 L 18 30" stroke="#34d399" stroke-width="3" fill="none"/>
  <!-- sharp white horizontal rungs -->
  <path d="M 8 8 L 24 8" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <path d="M 8 24 L 24 24" stroke="#ffffff" stroke-width="2.5" fill="none"/>
</svg>